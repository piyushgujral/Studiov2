name: Build Payuu Capture Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/PayuuCapture-Android/**'
      - '.github/workflows/build-android-capture.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        run: gradle -p apps/PayuuCapture-Android :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PayuuCapture-debug-apk
          path: apps/PayuuCapture-Android/app/build/outputs/apk/debug/app-debug.apk
